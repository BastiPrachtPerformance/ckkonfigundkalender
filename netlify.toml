[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

# ── API-Redirects ──────────────────────────────────────────
# Öffentliche Endpunkte
[[redirects]]
  from = "/api/pricing"
  to = "/.netlify/functions/pricing"
  status = 200

[[redirects]]
  from = "/api/requests"
  to = "/.netlify/functions/requests"
  status = 200

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

# Admin: Login
[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

# Admin: Session + Speicherstatus
[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/admin-session"
  status = 200

# Admin: Anfragen-Liste
[[redirects]]
  from = "/api/admin/requests"
  to = "/.netlify/functions/admin-requests"
  status = 200

# Admin: einzelne Anfrage (Pfadparameter -> Query-Parameter :splat)
[[redirects]]
  from = "/api/admin/requests/*"
  to = "/.netlify/functions/admin-request-detail?id=:splat"
  status = 200

# Admin: Preise (reset muss wegen Spezifität zuerst kommen)
[[redirects]]
  from = "/api/admin/pricing/reset"
  to = "/.netlify/functions/admin-pricing-reset"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/pricing"
  to = "/.netlify/functions/admin-pricing"
  status = 200

# SPA-Fallback: /admin -> admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/admin/availability"
  to = "/.netlify/functions/admin-availability"
  status = 200
